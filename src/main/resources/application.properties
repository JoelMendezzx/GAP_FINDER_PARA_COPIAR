spring.application.name=gapfinder

spring.datasource.url=jdbc:postgresql://localhost:5432/gapfinder
spring.datasource.username=gapfinder
spring.datasource.password=gapfinder
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
